<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Intervals">
  <meta name="theme-color" content="#111418">
  <title>Intervals</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="home" class="screen">
    <h1>Intervals</h1>

    <section class="card">
      <div class="field">
        <span>Seconds per set</span>
        <div class="stepper">
          <button type="button" data-step="secs" data-delta="-5">−</button>
          <input id="secs" type="number" inputmode="numeric" min="1" max="3600" value="30">
          <button type="button" data-step="secs" data-delta="5">+</button>
        </div>
      </div>
      <div class="field">
        <span>Sets</span>
        <div class="stepper">
          <button type="button" data-step="sets" data-delta="-1">−</button>
          <input id="sets" type="number" inputmode="numeric" min="1" max="99" value="5">
          <button type="button" data-step="sets" data-delta="1">+</button>
        </div>
      </div>
      <div class="field">
        <span>Rest between sets (sec)</span>
        <div class="stepper">
          <button type="button" data-step="rest" data-delta="-1">−</button>
          <input id="rest" type="number" inputmode="numeric" min="0" max="600" value="3">
          <button type="button" data-step="rest" data-delta="1">+</button>
        </div>
      </div>
      <button id="start" class="primary big">Start</button>
      <div class="save-row">
        <input id="fav-name" type="text" placeholder="Name (e.g. Calf raises)" maxlength="40">
        <button id="save" class="secondary">Save</button>
      </div>
    </section>

    <h2>Favorites</h2>
    <ul id="favs"></ul>
    <p id="no-favs" class="muted">No favorites yet. Set a time and sets, give it a name, tap Save.</p>

    <details class="card settings">
      <summary>Sound settings</summary>
      <label class="toggle"><span>Tick each second during a set</span><input id="opt-tick" type="checkbox"></label>
      <label class="toggle"><span>Halfway beep</span><input id="opt-half" type="checkbox"></label>
      <label class="toggle"><span>Voice announcements</span><input id="opt-voice" type="checkbox"></label>
      <label class="toggle"><span>Mix with music / podcasts<small>Beeps play over your audio, but the silent switch mutes them</small></span><input id="opt-mix" type="checkbox"></label>
      <label class="slider"><span>Volume</span><input id="opt-volume" type="range" min="5" max="100" step="5"></label>
      <div class="tests">
        <span>Preview</span>
        <button data-test="ready">Get ready</button>
        <button data-test="warn">Set ending</button>
        <button data-test="rest">Rest start</button>
        <button data-test="restTick">Rest count</button>
        <button data-test="go">Go</button>
        <button data-test="tick">Tick</button>
        <button data-test="half">Halfway</button>
        <button data-test="done">Done</button>
        <button data-test="voice">Voice</button>
      </div>
    </details>
  </main>

  <main id="run" class="screen" hidden>
    <div id="run-name" class="run-name"></div>
    <div id="phase" class="phase"></div>
    <div id="clock" class="clock">0</div>
    <div id="setinfo" class="setinfo"></div>
    <div class="controls">
      <button id="pause" class="secondary big">Pause</button>
      <button id="stop" class="danger big">Stop</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
